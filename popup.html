<!DOCTYPE html>

<html lang="zh-CN">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>NetAcad 学习进度</title>

  <link rel="stylesheet" href="netacad-adl-popup.css" />

</head>

<body>

  <header>

    <h1>NetAcad 学习进度助手</h1>

  </header>



  <section class="card">

    <h2>课程与模块</h2>

    <label class="field">

      <span>课程</span>

      <input

        type="text"

        id="courseSlug"

        readonly

        tabindex="-1"

        class="readonly-input"

        placeholder="尚未从页面检测到"

        spellcheck="false"

        autocomplete="off"

      />

    </label>

    <label class="field">

      <span>当前模块</span>

      <input

        type="text"

        id="heardCurrentModule"

        readonly

        tabindex="-1"

        class="readonly-input"

        placeholder="尚未从页面检测到"

        spellcheck="false"

        autocomplete="off"

      />

    </label>

    <div class="module-tip">

      <ul class="module-tip-list">

        <li>发送进度 <strong>每次只提交当前这一次会话</strong> 对应的课件</li>

        <li>发送前请在下方 <strong>展开查看监听参数</strong> 里核对 <strong>json网址</strong> 是否与当前课程一致</li>

        <li>若仍没有所需数据或未对齐，请先点击下方的 <strong>刷新</strong> 按钮再试</li>

        <li>若仍然没有，请 <strong>刷新本页网页</strong> 后再试</li>

      </ul>

    </div>

    <div class="row popup-actions">

      <button type="button" id="refreshStatus" class="btn">刷新</button>

      <button id="postProgress" type="button" class="btn primary flex-grow">发送进度</button>

    </div>

  </section>



  <section class="card">

    <h2>状态</h2>

    <p id="lessonLine" class="status-line" aria-live="polite"></p>

    <p id="syncLine" class="status-line" aria-live="polite"></p>

    <details class="capture-details">

      <summary>展开查看监听参数</summary>

      <div id="captureDetail" class="capture-json-stack" aria-live="polite"></div>

    </details>

  </section>



  <p id="toast" class="toast" aria-live="polite"></p>



  <script src="netacad-activity-parse.js"></script>

  <script src="progress-common.js"></script>

  <script src="popup.js"></script>

</body>

</html>
